name: Daily conflict update

on:
  schedule:
    # 07:30 Europe/Luzern is 06:30 UTC in winter. Adjust if you want.
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run updater
        env:
          USER_AGENT: "Konfliktkarte (GitHub Actions) - Kontakt: Marcel Christen <deltree22@gmail.com>"
          # Optional (recommended if you do more geocoding):
          NOMINATIM_EMAIL: "deltree22@gmail.com"
          MAX_ITEMS_PER_SOURCE: "20"
          DAYS_BACK: "2"
          GEOCODE_DELAY_SEC: "1.1"
        run: |
          python scripts/update_conflicts.py

      - name: Commit changes
        run: |
          git config user.name "conflict-map-bot"
          git config user.email "conflict-map-bot@users.noreply.github.com"
          git add data/conflicts.geojson data/geocache.json
          git commit -m "Daily update" || exit 0
          git push
