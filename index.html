<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Konflikt-Lagebild</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    header { padding: 12px 16px; border-bottom: 1px solid #e5e5e5; }
    #map { height: calc(100vh - 56px); }
    .meta { color: #555; font-size: 14px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid #ddd; font-size:12px; }
    .popup h3 { margin: 0 0 6px 0; font-size: 16px; }
    .popup p { margin: 6px 0; font-size: 13px; }
    .popup a { font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div><strong>Konflikt- und Kriegsnews</strong></div>
    <div class="meta">Automatisch aktualisiert aus oeffentlichen Quellen. Standortangaben koennen ungenau sein.</div>
  </header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
