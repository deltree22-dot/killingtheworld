<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Konflikt-Lagebild</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#0f1620;
      --panel2:#0c121a;
      --text:#e8eef6;
      --muted:#a9b6c6;
      --border:#223043;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --focus:#6aa9ff;

      --status-aktiv:#ff4d4d;
      --status-eskalierend:#ff9f2e;
      --status-fruehwarnung:#ffd24d;
      --status-deeskalierend:#4dd58a;
      --status-unbekannt:#9aa6b2;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    header{
      padding:12px 16px;
      border-bottom:1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0));
    }
    header .meta{ color:var(--muted); font-size:14px; margin-top:4px; }

    .layout{ display:flex; height: calc(100vh - 70px); }
    .sidebar{
      width: 420px; min-width: 320px; max-width: 560px;
      border-right:1px solid var(--border);
      padding:12px 12px 0 12px;
      overflow:auto;
      background:var(--panel2);
    }
    .mapwrap{ flex:1; background:var(--bg); }
    #map{ height:100%; }

    .row{ display:flex; gap:10px; align-items:center; margin-bottom:10px; }
    label{ font-size:13px; color:var(--muted); }

    select{
      width:100%;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:12px;
      font-size:14px;
      background:var(--panel);
      color:var(--text);
      outline:none;
    }
    select:focus{ border-color:var(--focus); box-shadow:0 0 0 3px rgba(106,169,255,.15); }

    .summaryline{ font-size:13px; color:var(--muted); margin:10px 0 12px 0; }

    .list{ list-style:none; padding:0; margin:0; }
    .item{
      border:1px solid var(--border);
      border-radius:16px;
      padding:10px 10px;
      margin-bottom:10px;
      cursor:pointer;
      background:rgba(255,255,255,.02);
      box-shadow: var(--shadow);
    }
    .item:hover{ background:rgba(255,255,255,.04); }
    .item .top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
    .item .title{ font-weight:650; font-size:14px; line-height:1.25; }
    .item .meta{ font-size:12px; color:var(--muted); margin-top:6px; }
    a{ color: #8bbcff; text-decoration:none; }
    a:hover{ text-decoration:underline; }

    .badge{
      display:inline-block;
      padding:2px 9px;
      border-radius:999px;
      font-size:12px;
      white-space:nowrap;
      border:1px solid var(--border);
      background: rgba(255,255,255,.03);
      color: var(--text);
    }
    .badge--aktiv{ border-color: rgba(255,77,77,.55); color: var(--status-aktiv); }
    .badge--eskalierend{ border-color: rgba(255,159,46,.55); color: var(--status-eskalierend); }
    .badge--fruehwarnung{ border-color: rgba(255,210,77,.55); color: var(--status-fruehwarnung); }
    .badge--deeskalierend{ border-color: rgba(77,213,138,.55); color: var(--status-deeskalierend); }
    .badge--unbekannt{ border-color: rgba(154,166,178,.55); color: var(--status-unbekannt); }

    .empty{
      border:1px dashed var(--border);
      border-radius:16px;
      padding:12px;
      color:var(--muted);
      font-size:13px;
      background: rgba(255,255,255,.02);
    }

    /* Leaflet popups dark */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip{
      background: var(--panel);
      color: var(--text);
      border:1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .leaflet-container a{ color:#8bbcff; }
    .popup h3{ margin:0 0 6px 0; font-size:16px; }
    .popup p{ margin:6px 0; font-size:13px; color: var(--muted); }
    .popup p strong{ color: var(--text); }
  </style>

</head>
<body>
  <header>
    <div><strong>KillingTheWorld – Konfliktlage</strong></div>
    <div class="meta">Automatisch aktualisiert aus oeffentlichen Quellen. Standortangaben koennen ungenau sein.</div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="row">
        <label for="countrySelect" style="min-width: 46px;">Land</label>
        <select id="countrySelect">
          <option value="">Alle Laender</option>
        </select>
      </div>
      <div class="summaryline" id="summaryLine">Lade Daten ...</div>
      <ul class="list" id="conflictList"></ul>
      <div id="emptyState" class="empty" style="display:none;">
        Keine Eintraege gefunden. Falls du gerade erst eingerichtet hast: der taegliche Update-Workflow muss mindestens einmal gelaufen sein.
      </div>
    </aside>

    <div class="mapwrap">
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
